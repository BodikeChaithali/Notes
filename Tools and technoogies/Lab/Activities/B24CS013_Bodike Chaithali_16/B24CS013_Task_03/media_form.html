<!DOCTYPE html>
<head>
    <title>media_form.html</title>
</head>
<body>
    <div style="text-align: left; padding: 20px;">
        <h1>Image with width and height</h1>
        <image src="iit-bhilai.jpg" alt="iit-bhilai-logo" width="200" height="200">
        <h1>Audio</h1>
        <audio controls>
            <source src="soft_tone_2sec.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <h1>Video</h1>
        <video width="320" height="240" controls>
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <h1>Registration form</h1>
        <form>
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Full Name"><br><br>
            <label for="pass">Password</labhttps://www.w3schools.com/html/mov_bbb.mp4el>
            <input type="password" id="pass" name="pass" placeholder="Password"><br><br>
            <label>Gender</label><br>
            <input type="radio" name="gender" value="Male"> Male<br>
            <input type="radio" name="gender" value="Female"> Female<br>
            <input type="radio" name="gender" value="Others"> Others<br><br>
            <label>Hobbies</label><br>
            <input type="checkbox" name="hobby" value="Reading"> Reading<br>
            <input type="checkbox" name="hobby" value="Music"> Music<br>
            <input type="checkbox" name="hobby" value="Sports"> Sports<br><br>
            <label for="num">Number (1-100)</label>
            <input type="number" id="num" name="num" min="1" max="100"><br><br>
            <label for="date">Date</label>
            <input type="date" id="date" name="date"><br><br>
            <label for="time">Time:</label>
            <input type="time" id="time" name="time"><br><br>
            <label for="city">City</label>
            <select id="city" name="city">
                <option value="">--Select City--</option>
                <option value="Delhi">Delhi</option>
                <option value="Mumbai">Mumbai</option>
                <option value="Chennai">Chennai</option>
                <option value="Kolkata">Kolkata</option>
            </select><br><br>
            <label for="comments">Comments</label>
            <textarea id="comments" name="comments" rows="4" cols="30" 
            placeholder="Enter your comments here..."></textarea><br><br>
            <input type="submit" value="Register">
        </form>
    </div>
</body>
</html>
