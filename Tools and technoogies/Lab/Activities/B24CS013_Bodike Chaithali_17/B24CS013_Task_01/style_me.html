<!DOCTYPE html>
<head>
    <title>CSS Styling Challenge</title>
    <style>
        p.green-text {
            color: green;
            font-weight: bold;
        }
    </style>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="main">
        <h1 class="main-heading">CSS Styling Challenge</h1>
        <p style="color: blue;font-size: large;">
            This is the line with 
            font-color:"blue" and font-size:"large".
        </p>
        <p class="green-text">
            This is the line with 
            font-color:"green" and font-weight:"bold".
        </p>

    </div>
</body>
</html>
