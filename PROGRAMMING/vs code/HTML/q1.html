<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday with Bubbles</title>
    <style>
        body {
            background-color: #f0f8ff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .birthday-text {
            font-size: 4rem;
            font-weight: bold;
            color: #ff69b4;
            text-align: center;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        /* Bubble styles */
        .bubble {
            position: absolute;
            width: 50px;
            height: 50px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: bubble-animation 10s infinite;
        }

        @keyframes bubble-animation {
            0% {
                transform: translateY(100vh) scale(0);
            }
            50% {
                transform: translateY(-100vh) scale(1);
                opacity: 0.7;
            }
            100% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
        }

        /* Bubble animations at different speeds and sizes */
        .bubble:nth-child(1) {
            left: 10%;
            animation-duration: 12s;
            animation-delay: 2s;
            width: 60px;
            height: 60px;
        }

        .bubble:nth-child(2) {
            left: 30%;
            animation-duration: 15s;
            animation-delay: 0s;
            width: 40px;
            height: 40px;
        }

        .bubble:nth-child(3) {
            left: 50%;
            animation-duration: 11s;
            animation-delay: 5s;
            width: 55px;
            height: 55px;
        }

        .bubble:nth-child(4) {
            left: 70%;
            animation-duration: 14s;
            animation-delay: 3s;
            width: 50px;
            height: 50px;
        }

        .bubble:nth-child(5) {
            left: 90%;
            animation-duration: 16s;
            animation-delay: 1s;
            width: 45px;
            height: 45px;
        }
    </style>
</head>
<body>
    <div class="birthday-text">Happy Birthday!</div>

    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>

</body>
</html>
